<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>LLMQ — Heardle du jour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>LLMQ</h1>
    <p class="subtitle">Devine le titre à partir de l'intro</p>

    <section class="player">
      <button id="play-btn" class="play-btn" type="button" aria-label="Écouter">▶</button>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <span id="allowed-seconds" class="allowed-seconds">0:01</span>
    </section>

    <section class="pips" id="pips" aria-label="Tentatives"></section>

    <section class="search-section">
      <div class="autocomplete">
        <input
          id="title-input"
          type="text"
          autocomplete="off"
          placeholder="Titre de la chanson..."
          aria-label="Rechercher un titre"
        />
        <ul id="suggestions" class="suggestions"></ul>
      </div>
      <div class="actions">
        <button id="guess-btn" type="button">Valider</button>
        <button id="skip-btn" type="button" class="secondary">Passer</button>
      </div>
      <p id="error-msg" class="error-msg" role="alert"></p>
    </section>

    <section id="history" class="history" aria-label="Historique des tentatives"></section>

    <section id="result" class="result hidden">
      <h2 id="result-title"></h2>
      <p id="result-answer"></p>
      <p id="result-summary"></p>
      <button id="reset-btn" type="button" class="secondary">Rejouer (dev)</button>
    </section>
  </main>

  <audio id="audio-el" preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
